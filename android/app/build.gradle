plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zone.finder'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zone.finder'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'zone.keystore')
            storePassword System.getenv('KS_PASS') ?: ''
            keyAlias 'zone'
            keyPassword System.getenv('KS_PASS') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
